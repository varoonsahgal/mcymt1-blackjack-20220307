name: Cleanup Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Delete all branches except main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all branches..."
          git fetch --all
          
          echo "Branches that will be deleted:"
          git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||' | grep -v '^main$'
          
          echo ""
          echo "Starting branch deletion..."
          git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||' | grep -v '^main$' | while read branch; do
            echo "Deleting branch: $branch"
            if ! OUTPUT=$(git push origin --delete "$branch" 2>&1); then
              echo "Warning: Failed to delete $branch"
              echo "Error details: $OUTPUT"
            else
              echo "Successfully deleted $branch"
            fi
          done
          
          echo ""
          echo "Branch cleanup completed!"
          echo ""
          echo "Remaining branches:"
          git ls-remote --heads origin
